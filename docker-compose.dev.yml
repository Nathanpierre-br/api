services:
  api:
    build: .
    ports: ["8080:8081"]
    env_file: .env
    depends_on:
      - mongo
      - minio

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
  
  createbucket:
    image: minio/mc
    depends_on:
      - minio
    env_file: .env
    entrypoint: /bin/sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_ACCESS_KEY}; mc mb --ignore-existing local/$${S3_BUCKET_NAME}; mc anonymous set download local/$${S3_BUCKET_NAME}"

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

volumes:
  mongo_data:
  minio_data:
