[supervisord]
nodaemon=true

[program:valkey]
command=valkey-server
autostart=true
autorestart=unexpected

[program:api]
command=uv run uvicorn main:app --host 0.0.0.0 --port 8081
autostart=true
autorestart=unexpected
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:exit_on_failure]
command=bash -c "printf 'READY\n'; while read line; do kill -SIGTERM $(cat /var/run/supervisord.pid); done"
events=PROCESS_STATE_FATAL
