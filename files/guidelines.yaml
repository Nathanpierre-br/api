ru: |
  AltAmino – проект, который пытается возродить Amino, имитируя оригинальные сервера. Проект написан с нуля и находится в далеко не стабильной версии, так что стоит ожидать баги, ошибки, а также периодические падения серверов. 
  
  Так как платформа изначально была 13+, то и мы будем придерживаться такого рейтинга, и именно относительно его мы и построили общие для всех сообществ (включая глобального) правила. 
  
  Мы не отвечаем за тех, кому меньше 13 (в Европейском союзе - 16) лет и можем даже заблокировать аккаунт такого пользователя, если потребуется.
  
  [B]NSFW / 18+ контент
  
  Всё, что расценивается как NSFW / 18+ контент, строго запрещено. Это касается не только медиаконтента (аудио, видео, фото), но и текста. 
  
  За контент такого содержания мы будем крайне строго карать.
  
  [B]Запрещённый контент
  
  Любой экстремистский, пропагандистский, суицидальный, политический и/или террористический контент и контент, который может навредить здоровью человека, распространяет запрещённые вещества или предметы, призывает действиям экстремистского, суицидального и другого запрещённого характера, а также любой другой контент, общепризнанный как запрещённый и/или экстремистский строго запрещён.
  
  Пользователей, что выкладывают данный контент, ожидает перманентная блокировка (включая последующие аккаунты). Если контент крайне серьезный, мы можем сообщить интернет-провайдеру, что с их IP адреса совершаются такие действия. 
  
  [B]Спам, реклама
  
  Объединим в этом пункте понятия "спам" и "реклама" в одно целое, так как эти вещи всё равно никто не любит. 
  Автоматизированная реклама и спам (т.е. рейды, спам, реклама ботами и похожее) запрещено, а IP адреса рискуют быть заблокированными и получить жалобу на спам в Spamhaus.
  
  Обратите внимание! Мы не блокируем VPN, прокси, датацентры и подобное, так как прекрасно понимаем, что Интернет не везде достаточно свободный.
  
  Обратите внимание! Мы не запрещаем ботов и можем даже одобрять аккаунты ботов, выдавая верификацию аккаунта и звание. Однако это не значит, что надо пользоваться ботами и скриптами (автоматизацией), что наносит вред как платформе, так и сообществам, чатам, пользователям и так далее! 
  
  [B]Непристойное поведение
  
  Агрессия, угрозы, оскорбления и/или непристойное поведение не приветствуются. Пожалуйста, будьте хотя бы нейтральны к друг другу! Вы все такие же люди в реальности и повода принижать честь и достоинство других реально не имеет смысла. 
  
  К непристойному поведению также можно отнести непрофессионализм администрации сообществ. Например: игнорирование участников и/или выдача наказаний участникам без весомых причин, низкая активность, несоблюдение собственных и общих правил, игнорирование или выдумка нарушений...
  
  [B]Конфиденциальность участников
  
  Без разрешения участника запрещено распространение любой личной о нём информации вне зависимости от причин. Мы такое не приветствуем и будем делать всё, чтобы привлечь к ответственности доксеров.
  
  [B]Нелегальные действия
  
  Нарушение авторского права, гэмблинг, казино, ставки, лотереи и всё, что требует любого вложения средств, строго запрещено.
en: |
  AltAmino is a project that aims to revive Amino by simulating the original servers. The project is written from scratch and is in a far-from-stable version, so you should expect bugs, errors, and periodic server downtime.
  
  Since the platform was originally 13+, we will adhere to that rating as well, and it is based on this that we have built common rules for all communities (including the global one).
  
  We are not responsible for those under 13 years of age (16 years in the European Union), and we may even block such a user's account if necessary.
  
  [B]NSFW / 18+ content
  
  Anything considered NSFW / 18+ content is strictly prohibited. This applies not only to media content (audio, video, photos) but also to text.
  
  We will punish content of this nature extremely strictly.
  
  [B]Prohibited content
  
  Any extremist, propaganda, suicidal, political, and/or terrorist content, as well as content that may harm human health, distribute prohibited substances or items, incite extremist, suicidal, or other prohibited actions, as well as any other content generally recognized as prohibited and/or extremist, is strictly forbidden.
  
  Users who post such content will face a permanent ban (including subsequent accounts). If the content is extremely serious, we may report to the Internet Service Provider that such actions are being committed from their IP address.
  
  [B]Spam, advertising
  
  We will combine the concepts of "spam" and "advertising" into one point, as nobody likes these things anyway.
  Automated advertising and spam (i.e., raids, spam, bot advertising, and similar) are prohibited, and IP addresses risk being blocked and reported for spam to Spamhaus.
  
  Please note! We do not block VPNs, proxies, data centers, and the like, as we perfectly understand that the Internet is not free enough everywhere.
  
  Please note! We do not prohibit bots and may even approve bot accounts by granting them account verification and a title. However, this does not mean that you should use bots and scripts (automation) that harm the platform, communities, chats, users, and so on!
  
  [B]Inappropriate behavior
  
  Aggression, threats, insults, and/or inappropriate behavior are not welcome. Please at least be neutral toward each other! You are all human beings in reality, and there is no real point in demeaning the honor and dignity of others.
  
  Inappropriate behavior can also include unprofessionalism by community administration. For example: ignoring members and/or punishing members without valid reasons, low activity, failure to comply with one's own or general rules, ignoring or inventing violations...
  
  [B]Member privacy
  
  Sharing any personal information about a member without their permission is prohibited, regardless of the reasons. We do not welcome this and will do everything possible to hold doxxers accountable.
  
  [B]Illegal activities
  
  Copyright infringement, gambling, casinos, betting, lotteries, and anything that requires any financial investment is strictly prohibited.


ar: |
  AltAmino – مشروع يحاول إحياء Amino عن طريق تقليد الخوادم الأصلية. تمت كتابة المشروع من الصفر وهو في إصدار غير مستقر بعد، لذا يجب توقع وجود أخطاء، مشاكل، وتعطل دوري للخوادم.

  بما أن المنصة كانت في الأصل مخصصة لمن هم 13+ عامًا، فسنلتزم بهذا التصنيف العمري، وعلى أساسه قمنا ببناء القواعد العامة لجميع المجتمعات (بما في ذلك المجتمع العالمي).

  نحن لا نتحمل المسؤولية عن من هم أقل من 13 عامًا (16 عامًا في الاتحاد الأوروبي) ويمكننا حظر حساب مثل هذا المستخدم إذا لزم الأمر.

  [B]محتوى NSFW / للبالغين فقط

  أي شيء يُعتبر محتوى NSFW / للبالغين ممنوع منعًا باتًا. وهذا لا يشمل الوسائط فقط (صوت، فيديو، صور) بل النص أيضًا.

  سنعاقب على هذا النوع من المحتوى بصرامة شديدة.

  [B]المحتوى الممنوع

  يُمنع منعًا باتًا أي محتوى متطرف، دعائي، يتعلق بالانتحار، سياسي و/أو إرهابي، وأي محتوى قد يضر بصحة الإنسان، أو ينشر مواد أو أدوات محظورة، أو يدعو إلى أعمال متطرفة أو انتحارية أو غيرها من الأعمال الممنوعة، وكذلك أي محتوى آخر معروف بأنه ممنوع و/أو متطرف.

  المستخدمون الذين ينشرون هذا النوع من المحتوى سيتعرضون لحظر دائم (يشمل أي حسابات لاحقة). إذا كان المحتوى خطيرًا جدًا، يمكننا إبلاغ مزود خدمة الإنترنت بأن هذه الأنشطة تتم من عنوان IP الخاص بهم.

  [B]السبام والإعلانات

  سندمج مفهومي "السبام" و"الإعلانات" في نقطة واحدة، لأن لا أحد يحب هذه الأشياء على أي حال.
  الإعلانات والسبام الآلي (أي الهجمات الجماعية، السبام، الإعلانات بواسطة البوتات وما شابه) ممنوعة، وعناوين IP المخالفة معرضة للحظر وللإبلاغ عنها كسبام إلى Spamhaus.

  ملاحظة! لا نحظر VPN، البروكسي، مراكز البيانات وما شابه، لأننا نتفهم تمامًا أن الإنترنت ليس حرًا بالقدر الكافي في كل مكان.

  ملاحظة! لا نمنع البوتات، وقد نوافق حتى على حسابات البوتات، مع منحها توثيقًا ولقبًا. لكن هذا لا يعني أنه يجوز استخدام البوتات والسكريبتات (الأتمتة) بطريقة تضر بالمنصة والمجتمعات والدردشات والمستخدمين وما إلى ذلك!

  [B]السلوك غير اللائق

  العدوانية، التهديدات، الإهانات و/أو السلوك غير اللائق غير مرحب بها. يرجى أن تكونوا على الأقل محايدين مع بعضكم البعض! أنتم جميعًا بشر في الواقع، ولا فائدة من الإساءة لشرف وكرامة الآخرين.

  يمكن اعتبار عدم احترافية إدارة المجتمعات سلوكًا غير لائق أيضًا. على سبيل المثال: تجاهل الأعضاء و/أو معاقبتهم دون أسباب وجيهة، النشاط المنخفض، عدم الالتزام بالقواعد الخاصة والعامة، تجاهل المخالفات أو افتراء ارتكابها...

  [B]خصوصية الأعضاء

  يُمنع نشر أي معلومات شخصية عن عضو دون إذنه، بغض النظر عن السبب. نحن لا نقبل ذلك وسنفعل كل ما بوسعنا لمحاسبة من يقوم بـ "الدوكسينج".

  [B]الأعمال غير القانونية

  انتهاك حقوق النشر، القمار، الكازينوهات، الرهانات، اليانصيب، وأي شيء يتطلب استثمار أموال ممنوع منعًا باتًا.

es: |
  AltAmino – un proyecto que intenta revivir Amino, imitando los servidores originales. El proyecto fue escrito desde cero y se encuentra en una versión bastante inestable, así que hay que esperar errores, fallos y caídas periódicas de los servidores.

  Dado que la plataforma originalmente era para mayores de 13 años, nosotros mantendremos esa misma clasificación, y en base a ella hemos construido las reglas generales para todas las comunidades (incluida la global).

  No nos hacemos responsables de quienes tengan menos de 13 años (16 en la Unión Europea) y podemos incluso bloquear la cuenta de dicho usuario si fuera necesario.

  [B]Contenido NSFW / +18

  Todo lo que se considere contenido NSFW / +18 está estrictamente prohibido. Esto no solo se aplica a contenido multimedia (audio, video, fotos), sino también a texto.

  Castigaremos con extrema severidad este tipo de contenido.

  [B]Contenido prohibido

  Está estrictamente prohibido cualquier contenido extremista, de propaganda, suicida, político y/o terrorista, así como contenido que pueda dañar la salud de las personas, que difunda sustancias u objetos prohibidos, que incite a acciones extremistas, suicidas u otras acciones prohibidas, y cualquier otro contenido reconocido como prohibido y/o extremista.

  Los usuarios que publiquen este tipo de contenido recibirán un bloqueo permanente (incluidas cuentas posteriores). Si el contenido es extremadamente grave, podemos informar al proveedor de Internet de que dichas acciones se están realizando desde su dirección IP.

  [B]Spam, publicidad

  Uniremos los conceptos de "spam" y "publicidad" en un solo punto, ya que de todos modos a nadie le gustan estas cosas.
  La publicidad y el spam automatizados (es decir, raids, spam, publicidad por bots y similares) están prohibidos, y las direcciones IP corren el riesgo de ser bloqueadas y reportadas a Spamhaus por spam.

  ¡Atención! No bloqueamos VPN, proxies, centros de datos ni similares, ya que entendemos perfectamente que Internet no es lo suficientemente libre en todas partes.

  ¡Atención! No prohibimos los bots y hasta podemos aprobar cuentas de bots, otorgándoles verificación de cuenta y un título. Sin embargo, esto no significa que se deba usar bots y scripts (automatización) que dañen tanto a la plataforma como a las comunidades, chats, usuarios, etc.

  [B]Comportamiento indecente

  La agresión, las amenazas, los insultos y/o el comportamiento indecente no son bienvenidos. Por favor, ¡sean al menos neutrales entre ustedes! Todos son personas reales, y no tiene sentido alguno menospreciar el honor y la dignidad de los demás.

  El comportamiento indecente también puede incluir la falta de profesionalismo de la administración de las comunidades. Por ejemplo: ignorar a los participantes y/o aplicar sanciones sin motivos válidos, baja actividad, incumplimiento de las reglas propias y generales, ignorar infracciones o inventarlas...

  [B]Privacidad de los participantes

  Está prohibido divulgar cualquier información personal de un participante sin su permiso, independientemente del motivo. No tolerामos esto y haremos todo lo posible para que los doxers rindan cuentas.

  [B]Acciones ilegales

  La violación de derechos de autor, el gambling, los casinos, las apuestas, las loterías y todo lo que requiera inversión de fondos está estrictamente prohibido.